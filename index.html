<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sesión continua — descubre qué ver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15161C;
    --surface: #1E2028;
    --surface-2: #262835;
    --border: #33364280;
    --text: #F2F1EC;
    --text-muted: #9A9CAB;
    --gold: #E8B23D;
    --gold-dim: #E8B23D33;
    --teal: #2E9C8F;
    --teal-dim: #2E9C8F33;
    --red: #D9534F;
    --red-dim: #D9534F33;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  .display{ font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; }

  #app{ width: 100%; max-width: 460px; min-height: 100vh; padding: 20px 18px 40px; position: relative; }

  /* marquee header */
  .marquee{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 4px 18px;
  }
  .marquee-title{ font-size: 30px; color: var(--gold); line-height: 1; }
  .marquee-lights{ display:flex; gap:5px; }
  .marquee-lights span{ width:6px; height:6px; border-radius:50%; background: var(--gold); opacity:.35; animation: blink 1.8s infinite; }
  .marquee-lights span:nth-child(2){ animation-delay:.3s; }
  .marquee-lights span:nth-child(3){ animation-delay:.6s; }
  @keyframes blink{ 0%,100%{opacity:.25} 50%{opacity:1} }

  .icon-btn{
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-muted); display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size: 16px; user-select:none;
  }
  .icon-btn:active{ transform: scale(0.94); }

  /* generic screen helpers */
  .screen{ display:none; }
  .screen.active{ display:block; }
  p.lead{ color: var(--text-muted); font-size: 14px; line-height:1.6; margin: 0 0 18px; }

  input[type=text], input[type=password]{
    width:100%; background: var(--surface); border:1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 10px; font-size:14px; font-family:inherit; outline:none;
  }
  input:focus{ border-color: var(--gold); }
  label.field-label{ font-size:12px; color: var(--text-muted); display:block; margin: 14px 0 6px; }

  .btn{
    display:block; width:100%; text-align:center; padding: 13px 16px; border-radius: 10px;
    background: var(--gold); color: #1A1200; font-weight:600; font-size:14px; border:none;
    cursor:pointer; margin-top: 20px; font-family:inherit;
  }
  .btn:active{ transform: scale(0.98); }
  .btn.ghost{ background:transparent; border:1px solid var(--border); color: var(--text); }
  .btn.small{ width:auto; display:inline-block; padding:8px 14px; margin:0; font-size:12px; }

  a.link{ color: var(--gold); cursor:pointer; font-size: 13px; }

  /* platform grid */
  .platform-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
  .platform-card{
    display:flex; align-items:center; gap:10px; padding: 14px; border-radius: 12px;
    background: var(--surface); border: 2px solid transparent; cursor:pointer;
  }
  .platform-card.selected{ border-color: var(--gold); background: var(--gold-dim); }
  .platform-dot{ width: 10px; height:10px; border-radius:50%; }
  .platform-name{ font-size: 13px; font-weight: 500; }

  /* card stack */
  .stack{ position: relative; height: 560px; margin-top: 6px; }
  .card{
    position:absolute; inset:0; border-radius: 20px; overflow:hidden;
    background: var(--surface); border: 1px solid var(--border);
    display:flex; flex-direction:column;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    touch-action: none;
  }
  /* ticket perforation notches */
  .card::before, .card::after{
    content:""; position:absolute; width: 22px; height: 22px; border-radius:50%;
    background: var(--bg); left: -11px; z-index: 2;
  }
  .card::before{ top: 168px; }
  .card::after{ top: 168px; left: auto; right: -11px; }

  .poster-wrap{ position:relative; height: 340px; background: var(--surface-2); flex-shrink:0; }
  .poster-wrap img{ width:100%; height:100%; object-fit: cover; display:block; }
  .poster-fallback{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; color: var(--text-muted); font-size: 40px; }
  .badge-score{
    position:absolute; top:12px; left:12px; background: var(--red); color:#fff;
    font-size: 12px; font-weight:600; padding: 3px 10px; border-radius: 20px;
  }
  .badge-platform{
    position:absolute; top:12px; right:12px; background: rgba(0,0,0,0.55);
    color:#fff; font-size:11px; padding: 4px 10px; border-radius: 20px; display:flex; align-items:center; gap:5px;
  }
  .swipe-flag{
    position:absolute; top: 20px; padding: 6px 16px; border-radius: 8px; font-size: 20px;
    font-family:'Bebas Neue',sans-serif; letter-spacing:0.06em; border: 3px solid; opacity:0; transform: rotate(-12deg);
  }
  .swipe-flag.like{ left: 20px; color: var(--teal); border-color: var(--teal); }
  .swipe-flag.nope{ right: 20px; color: var(--red); border-color: var(--red); transform: rotate(12deg); }

  .card-body{ padding: 16px 18px 18px; display:flex; flex-direction:column; flex:1; }
  .card-title{ font-size: 24px; line-height:1.05; }
  .card-meta{ color: var(--text-muted); font-size: 12px; margin: 4px 0 10px; }
  .genre-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .genre-pill{ background: var(--surface-2); font-size: 11px; padding: 4px 10px; border-radius: 20px; color: var(--text-muted); }
  .overview{ font-size: 13px; color: var(--text-muted); line-height:1.55; overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }

  .controls{ display:flex; justify-content:center; align-items:center; gap: 20px; margin-top: 18px; }
  .round-btn{
    width: 56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background: var(--surface); border: 1px solid var(--border); cursor:pointer; font-size: 22px;
  }
  .round-btn.nope{ color: var(--red); border-color: var(--red-dim); }
  .round-btn.like{ color: var(--teal); border-color: var(--teal-dim); }
  .round-btn.info{ width:42px; height:42px; font-size:16px; color: var(--text-muted); }
  .round-btn:active{ transform: scale(0.92); }

  .empty-state{ text-align:center; padding: 80px 20px; color: var(--text-muted); }
  .empty-state .display{ font-size: 26px; color: var(--gold); margin-bottom: 8px; }

  /* detail overlay */
  .overlay{
    position: fixed; inset:0; background: rgba(10,10,14,0.7); display:flex; align-items:flex-end;
    justify-content:center; z-index: 50; opacity:0; pointer-events:none; transition: opacity .18s ease;
  }
  .overlay.active{ opacity:1; pointer-events:all; }
  .sheet{
    width:100%; max-width: 460px; max-height: 82vh; overflow-y:auto; background: var(--surface);
    border-radius: 20px 20px 0 0; padding: 20px; transform: translateY(12px); transition: transform .18s ease;
  }
  .overlay.active .sheet{ transform: translateY(0); }
  .sheet-close{ width:36px; height:4px; background: var(--border); border-radius:4px; margin: 0 auto 16px; }
  .stat-row{ display:flex; gap:18px; margin: 10px 0 14px; }
  .stat{ }
  .stat .label{ font-size:11px; color:var(--text-muted); margin-bottom:2px; }
  .stat .value{ font-size:14px; font-weight:600; }
  .cast-row{ display:flex; gap:8px; flex-wrap:wrap; margin: 6px 0 4px; }

  /* profile */
  .stat-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin: 14px 0 22px; }
  .stat-card{ background: var(--surface); border-radius:12px; padding: 12px; text-align:center; }
  .stat-card .num{ font-size:20px; font-weight:600; color: var(--gold); }
  .stat-card .lbl{ font-size:11px; color: var(--text-muted); margin-top:2px; }
  .genre-bar-row{ margin-bottom:10px; }
  .genre-bar-track{ background: var(--surface-2); border-radius:6px; height:8px; overflow:hidden; margin-top:4px; }
  .genre-bar-fill{ height:100%; background: var(--gold); }

  .footer-note{ text-align:center; color: var(--text-muted); font-size: 11px; margin-top: 14px; }
  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- estado y almacenamiento ---------- */
const PROVIDER_QUERY = {
  netflix: { label: 'Netflix', dot: '#D9534F', names: ['Netflix'] },
  disney:  { label: 'Disney+', dot: '#1E6FD9', names: ['Disney Plus','Disney+'] },
  hbo:     { label: 'HBO Max', dot: '#8B5CF6', names: ['Max','HBO Max'] },
  prime:   { label: 'Prime Video', dot: '#2E9CD9', names: ['Amazon Prime Video','Prime Video'] }
};

let state = {
  screen: 'loading',
  apiKey: '',
  region: 'US',
  platforms: [],       // ['netflix','hbo',...]
  providerIds: {},     // { netflix: 8, ... }
  genreMap: {},        // { 28: 'Acción', ... }
  queue: [],
  current: null,
  liked: [],
  disliked: [],
  genreScores: {},
  page: 1,
  detailOpen: null,
  error: ''
};

async function loadStorage(){
  try{
    const s = await window.storage.get('settings');
    if(s && s.value){ const v = JSON.parse(s.value); state.apiKey = v.apiKey||''; state.platforms = v.platforms||[]; state.providerIds = v.providerIds||{}; }
  }catch(e){}
  try{
    const l = await window.storage.get('taste');
    if(l && l.value){ const v = JSON.parse(l.value); state.liked = v.liked||[]; state.disliked = v.disliked||[]; state.genreScores = v.genreScores||{}; }
  }catch(e){}
}
async function saveSettings(){
  try{ await window.storage.set('settings', JSON.stringify({apiKey: state.apiKey, platforms: state.platforms, providerIds: state.providerIds})); }catch(e){ console.error(e); }
}
async function saveTaste(){
  try{ await window.storage.set('taste', JSON.stringify({liked: state.liked, disliked: state.disliked, genreScores: state.genreScores})); }catch(e){ console.error(e); }
}

/* ---------- TMDB ---------- */
const TMDB = 'https://api.themoviedb.org/3';

async function tmdb(path, params={}){
  const url = new URL(TMDB + path);
  url.searchParams.set('api_key', state.apiKey);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  let res;
  try{
    res = await fetch(url.toString());
  }catch(networkErr){
    const e = new Error('NETWORK_OR_CORS');
    e.kind = 'network';
    throw e;
  }
  if(!res.ok){
    const e = new Error('TMDB_ERROR_' + res.status);
    e.kind = res.status === 401 ? 'invalid_key' : 'http_' + res.status;
    throw e;
  }
  return res.json();
}

async function verifyKeyAndLoadMeta(){
  const genres = await tmdb('/genre/movie/list', { language: 'es-ES' });
  state.genreMap = {};
  genres.genres.forEach(g => state.genreMap[g.id] = g.name);

  const provList = await tmdb('/watch/providers/movie', { watch_region: state.region });
  const ids = {};
  Object.entries(PROVIDER_QUERY).forEach(([key, cfg]) => {
    const match = provList.results.find(p => cfg.names.includes(p.provider_name));
    if(match) ids[key] = match.provider_id;
  });
  state.providerIds = ids;
}

async function fetchDiscoverPage(page, biasGenre){
  const selectedIds = state.platforms.map(p => state.providerIds[p]).filter(Boolean);
  const params = {
    watch_region: state.region,
    with_watch_providers: selectedIds.join('|'),
    watch_monetization_types: 'flatrate',
    sort_by: 'popularity.desc',
    'vote_count.gte': 50,
    language: 'es-ES',
    page
  };
  if(biasGenre) params.with_genres = biasGenre;
  const data = await tmdb('/discover/movie', params);
  return data.results || [];
}

function topGenre(){
  const entries = Object.entries(state.genreScores);
  if(!entries.length) return null;
  entries.sort((a,b) => b[1]-a[1]);
  return entries[0][0];
}

async function ensureQueue(){
  const seen = new Set([...state.liked.map(m=>m.id), ...state.disliked.map(m=>m.id), ...state.queue.map(m=>m.id)]);
  while(state.queue.length < 5){
    const useBias = state.liked.length >= 4 && Math.random() < 0.5;
    const results = await fetchDiscoverPage(state.page, useBias ? topGenre() : null);
    state.page += 1;
    const fresh = results.filter(m => !seen.has(m.id) && m.poster_path);
    fresh.forEach(m => seen.add(m.id));
    state.queue.push(...fresh);
    if(state.page > 25) break; // salvaguarda
    if(results.length === 0) break;
  }
}

/* ---------- lógica de swipe ---------- */
function registerSwipe(movie, liked){
  if(liked){
    state.liked.push({ id: movie.id, title: movie.title, genre_ids: movie.genre_ids });
    (movie.genre_ids||[]).forEach(g => { state.genreScores[g] = (state.genreScores[g]||0) + 1; });
  } else {
    state.disliked.push({ id: movie.id, title: movie.title });
  }
  saveTaste();
}

async function advanceCard(){
  state.queue.shift();
  state.current = state.queue[0] || null;
  render();
  await ensureQueue();
  if(!state.current && state.queue.length){ state.current = state.queue[0]; }
  render();
}

/* ---------- construcción de UI ---------- */
const app = document.getElementById('app');

function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html!==undefined) e.innerHTML = html; return e; }

function render(){
  app.innerHTML = '';
  if(state.screen === 'loading') return renderLoading();
  if(state.screen === 'setup') return renderSetup();
  if(state.screen === 'platforms') return renderPlatforms();
  if(state.screen === 'swipe') return renderSwipe();
  if(state.screen === 'profile') return renderProfile();
}

function renderLoading(){
  app.appendChild(el('div','marquee', `<div class="display marquee-title">Sesión continua</div>`));
  app.appendChild(el('p','lead','Cargando...'));
}

function renderSetup(){
  const wrap = el('div');
  wrap.appendChild(el('div','marquee', `
    <div class="display marquee-title">Sesión continua</div>
    <div class="marquee-lights"><span></span><span></span><span></span></div>
  `));
  wrap.appendChild(el('p','lead','Para traer pósters y catálogos reales necesitamos una clave gratuita de TMDB (The Movie Database). Se tarda 2 minutos: crea una cuenta en themoviedb.org → Ajustes → API → solicita una "API key (v3 auth)".'));

  const label = el('label','field-label','Tu clave de API de TMDB');
  wrap.appendChild(label);
  const input = el('input');
  input.type = 'text';
  input.placeholder = 'Pega aquí tu API key';
  input.value = state.apiKey;
  wrap.appendChild(input);

  if(state.error){
    const err = el('p','lead', state.error);
    err.style.color = 'var(--red)';
    wrap.appendChild(err);
  }

  const btn = el('button','btn','Continuar');
  btn.onclick = async () => {
    const key = input.value.trim();
    if(!key){ return; }
    state.apiKey = key;
    state.error = '';
    btn.textContent = 'Comprobando...';
    try{
      await verifyKeyAndLoadMeta();
      await saveSettings();
      state.screen = 'platforms';
      render();
    }catch(e){
      if(e.kind === 'network'){
        state.error = 'La clave puede ser correcta, pero el navegador ha bloqueado la conexión con TMDB (restricción de red del entorno, no de tu clave). Prueba a abrir https://api.themoviedb.org/3/movie/550?api_key=TU_CLAVE en una pestaña aparte: si ahí sí devuelve datos, tu clave funciona y necesitamos desplegar la app fuera de este entorno para que funcione del todo.';
      } else if(e.kind === 'invalid_key'){
        state.error = 'TMDB dice que la clave no es válida (error 401). Revisa que no tenga espacios de más, o que tu cuenta de developer esté ya "Approved" en tu panel de TMDB.';
      } else {
        state.error = 'Algo ha fallado al conectar con TMDB (' + e.message + '). Inténtalo de nuevo en unos segundos.';
      }
      btn.textContent = 'Continuar';
      render();
    }
  };
  wrap.appendChild(btn);

  const link = el('a','link','¿Dónde consigo la clave? →');
  link.style.display = 'block';
  link.style.marginTop = '14px';
  link.style.textAlign = 'center';
  link.onclick = () => window.open('https://www.themoviedb.org/settings/api', '_blank');
  wrap.appendChild(link);

  app.appendChild(wrap);
}

function renderPlatforms(){
  const wrap = el('div');
  wrap.appendChild(el('div','marquee', `<div class="display marquee-title">Tus plataformas</div>`));
  wrap.appendChild(el('p','lead','Marca a cuáles estás suscrito. Solo te enseñaremos títulos disponibles ahí mismo, sin buscar en catálogos que no tienes.'));

  const grid = el('div','platform-grid');
  Object.entries(PROVIDER_QUERY).forEach(([key, cfg]) => {
    const card = el('div', 'platform-card' + (state.platforms.includes(key) ? ' selected' : ''));
    card.innerHTML = `<span class="platform-dot" style="background:${cfg.dot}"></span><span class="platform-name">${cfg.label}</span>`;
    card.onclick = () => {
      const i = state.platforms.indexOf(key);
      if(i >= 0) state.platforms.splice(i,1); else state.platforms.push(key);
      renderPlatforms();
    };
    grid.appendChild(card);
  });
  wrap.appendChild(grid);

  const btn = el('button','btn','Empezar a descubrir');
  btn.disabled = state.platforms.length === 0;
  btn.style.opacity = state.platforms.length === 0 ? 0.5 : 1;
  btn.onclick = async () => {
    if(state.platforms.length === 0) return;
    await saveSettings();
    state.screen = 'swipe';
    render();
    await ensureQueue();
    state.current = state.queue[0] || null;
    render();
  };
  wrap.appendChild(btn);
  app.appendChild(wrap);
}

function posterUrl(path){ return path ? `https://image.tmdb.org/t/p/w500${path}` : null; }

function renderSwipe(){
  const wrap = el('div');
  const header = el('div','marquee');
  header.innerHTML = `
    <div class="display marquee-title" style="font-size:24px;">Para ti</div>
    <div style="display:flex; gap:8px;">
      <div class="icon-btn" id="btn-settings">⚙</div>
      <div class="icon-btn" id="btn-profile">☰</div>
    </div>`;
  wrap.appendChild(header);

  const stack = el('div','stack');
  if(!state.current){
    stack.appendChild(el('div','empty-state', `<div class="display">Sin nada nuevo por ahora</div><p>Prueba a marcar más plataformas o vuelve en un rato.</p>`));
  } else {
    stack.appendChild(buildCard(state.current));
  }
  wrap.appendChild(stack);

  if(state.current){
    const controls = el('div','controls');
    const nope = el('div','round-btn nope','✕');
    const info = el('div','round-btn info','i');
    const like = el('div','round-btn like','♥');
    nope.onclick = () => doSwipe(false);
    like.onclick = () => doSwipe(true);
    info.onclick = () => openDetail(state.current);
    controls.appendChild(nope); controls.appendChild(info); controls.appendChild(like);
    wrap.appendChild(controls);
  }

  const note = el('div','footer-note', `Filtrando por: ${state.platforms.map(p=>PROVIDER_QUERY[p].label).join(', ')}`);
  wrap.appendChild(note);

  app.appendChild(wrap);

  header.querySelector('#btn-settings').onclick = () => { state.screen = 'platforms'; render(); };
  header.querySelector('#btn-profile').onclick = () => { state.screen = 'profile'; render(); };
}

function buildCard(movie){
  const card = el('div','card');
  const posterWrap = el('div','poster-wrap');
  const url = posterUrl(movie.poster_path);
  if(url){
    posterWrap.innerHTML = `<img src="${url}" alt="">`;
  } else {
    posterWrap.appendChild(el('div','poster-fallback','🎬'));
  }
  const score = movie.vote_average ? Math.round(movie.vote_average * 10) + '%' : '—';
  posterWrap.appendChild(el('div','badge-score', score));

  const platBadge = el('div','badge-platform');
  const anyPlatform = state.platforms.find(p => state.providerIds[p]);
  platBadge.textContent = anyPlatform ? PROVIDER_QUERY[anyPlatform].label : '';
  posterWrap.appendChild(platBadge);

  const likeFlag = el('div','swipe-flag like','ME GUSTA');
  const nopeFlag = el('div','swipe-flag nope','PASO');
  posterWrap.appendChild(likeFlag);
  posterWrap.appendChild(nopeFlag);

  card.appendChild(posterWrap);

  const body = el('div','card-body');
  const year = (movie.release_date||'').slice(0,4);
  const genres = (movie.genre_ids||[]).slice(0,2).map(id => state.genreMap[id]).filter(Boolean);
  body.innerHTML = `
    <div class="card-title display">${movie.title}</div>
    <div class="card-meta">${year || ''}</div>
    <div class="genre-row">${genres.map(g=>`<span class="genre-pill">${g}</span>`).join('')}</div>
    <div class="overview">${movie.overview || 'Sin sinopsis disponible.'}</div>
  `;
  card.appendChild(body);

  attachDrag(card, likeFlag, nopeFlag);
  return card;
}

function attachDrag(card, likeFlag, nopeFlag){
  let startX = 0, startY = 0, dx = 0, dragging = false;
  const threshold = 110;

  function onDown(x,y){ dragging = true; startX = x; startY = y; card.style.transition = 'none'; }
  function onMove(x,y){
    if(!dragging) return;
    dx = x - startX;
    const dy = (y - startY) * 0.4;
    const rot = dx / 18;
    card.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
    likeFlag.style.opacity = Math.min(Math.max(dx/threshold,0),1);
    nopeFlag.style.opacity = Math.min(Math.max(-dx/threshold,0),1);
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    card.style.transition = 'transform .25s ease';
    if(dx > threshold){ flyOut(1); }
    else if(dx < -threshold){ flyOut(-1); }
    else { card.style.transform = 'translate(0,0) rotate(0)'; likeFlag.style.opacity=0; nopeFlag.style.opacity=0; }
  }
  function flyOut(dir){
    card.style.transform = `translate(${dir*600}px, -40px) rotate(${dir*30}deg)`;
    setTimeout(() => doSwipe(dir === 1), 180);
  }

  card.addEventListener('pointerdown', e => onDown(e.clientX, e.clientY));
  card.addEventListener('pointermove', e => onMove(e.clientX, e.clientY));
  card.addEventListener('pointerup', onUp);
  card.addEventListener('pointerleave', () => { if(dragging){ dragging=false; card.style.transition='transform .25s ease'; card.style.transform='translate(0,0) rotate(0)'; likeFlag.style.opacity=0; nopeFlag.style.opacity=0; } });
}

async function doSwipe(liked){
  if(!state.current) return;
  registerSwipe(state.current, liked);
  await advanceCard();
}

/* ---------- detalle ---------- */
async function openDetail(movie){
  const overlay = el('div','overlay active');
  const sheet = el('div','sheet');
  sheet.innerHTML = `<div class="sheet-close"></div><div class="display" style="font-size:22px;">${movie.title}</div><p class="lead">Cargando ficha...</p>`;
  overlay.appendChild(sheet);
  overlay.onclick = (e) => { if(e.target === overlay){ overlay.remove(); } };
  app.appendChild(overlay);

  try{
    const data = await tmdb(`/movie/${movie.id}`, { language: 'es-ES', append_to_response: 'credits' });
    const cast = (data.credits && data.credits.cast || []).slice(0,4).map(c=>c.name);
    sheet.innerHTML = `
      <div class="sheet-close"></div>
      <div class="display" style="font-size:22px;">${data.title}</div>
      <div class="card-meta">${(data.release_date||'').slice(0,4)} · ${data.runtime ? data.runtime+' min' : ''} · ${(data.genres||[]).map(g=>g.name).join(', ')}</div>
      <div class="stat-row">
        <div class="stat"><div class="label">TMDB</div><div class="value">${data.vote_average ? data.vote_average.toFixed(1) : '—'}</div></div>
        <div class="stat"><div class="label">Votos</div><div class="value">${data.vote_count || 0}</div></div>
      </div>
      <p class="overview" style="-webkit-line-clamp: unset;">${data.overview || 'Sin sinopsis disponible.'}</p>
      ${cast.length ? `<div class="field-label" style="margin-top:12px;">Reparto</div><div class="cast-row">${cast.map(n=>`<span class="genre-pill">${n}</span>`).join('')}</div>` : ''}
    `;
  }catch(e){
    sheet.innerHTML += `<p class="lead">No se ha podido cargar el detalle completo.</p>`;
  }
}

/* ---------- perfil ---------- */
function renderProfile(){
  const wrap = el('div');
  const header = el('div','marquee');
  header.innerHTML = `<div class="display marquee-title" style="font-size:24px;">Tu perfil</div><div class="icon-btn" id="back">←</div>`;
  wrap.appendChild(header);

  const stats = el('div','stat-grid');
  stats.innerHTML = `
    <div class="stat-card"><div class="num">${state.liked.length}</div><div class="lbl">Me gusta</div></div>
    <div class="stat-card"><div class="num">${state.disliked.length}</div><div class="lbl">Descartadas</div></div>
    <div class="stat-card"><div class="num">${state.liked.length+state.disliked.length}</div><div class="lbl">Valoradas</div></div>
  `;
  wrap.appendChild(stats);

  wrap.appendChild(el('div','field-label','Tus plataformas'));
  const grid = el('div','platform-grid');
  Object.entries(PROVIDER_QUERY).forEach(([key,cfg]) => {
    const card = el('div','platform-card' + (state.platforms.includes(key) ? ' selected':''));
    card.innerHTML = `<span class="platform-dot" style="background:${cfg.dot}"></span><span class="platform-name">${cfg.label}</span>`;
    card.onclick = async () => {
      const i = state.platforms.indexOf(key);
      if(i>=0) state.platforms.splice(i,1); else state.platforms.push(key);
      await saveSettings();
      renderProfile();
    };
    grid.appendChild(card);
  });
  wrap.appendChild(grid);

  wrap.appendChild(el('div','field-label','Tus géneros favoritos, según tus swipes'));
  const entries = Object.entries(state.genreScores).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(!entries.length){
    wrap.appendChild(el('p','lead','Todavía no tenemos suficientes datos. Sigue haciendo swipe.'));
  } else {
    const max = entries[0][1];
    entries.forEach(([gid,score]) => {
      const row = el('div','genre-bar-row');
      const pct = Math.round((score/max)*100);
      row.innerHTML = `<div style="display:flex; justify-content:space-between; font-size:12px;"><span>${state.genreMap[gid]||'—'}</span><span class="text-muted" style="color:var(--text-muted)">${score}</span></div><div class="genre-bar-track"><div class="genre-bar-fill" style="width:${pct}%"></div></div>`;
      wrap.appendChild(row);
    });
  }

  app.appendChild(wrap);
  header.querySelector('#back').onclick = () => { state.screen = 'swipe'; render(); };
}

/* ---------- arranque ---------- */
(async function init(){
  await loadStorage();
  if(!state.apiKey){ state.screen = 'setup'; render(); return; }
  try{
    await verifyKeyAndLoadMeta();
  }catch(e){
    state.screen = 'setup';
    state.error = 'Tu clave guardada ya no funciona, introdúcela de nuevo.';
    render();
    return;
  }
  if(!state.platforms.length){ state.screen = 'platforms'; render(); return; }
  state.screen = 'swipe';
  render();
  await ensureQueue();
  state.current = state.queue[0] || null;
  render();
})();
</script>
